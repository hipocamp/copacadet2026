<!DOCTYPE html>
<html lang="ca">
<head>
<> Html
<!-- Icona per a Android i navegadors -->
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/94/94203.png">
<!-- Icona per a iPhone (iOS) -->
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/94/94203.png">
<!-- Color de la barra superior al mòbil -->
<meta name="theme-color" content="#dc2626">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copa Catalana Cadet 2026</title>
    <!-- Estils professionals amb Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card { transition: transform 0.2s; }
        .card:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-slate-100 font-sans pb-10">

    <div class="max-w-md mx-auto">
        <!-- Capçalera -->
        <header class="bg-blue-600 text-white p-6 shadow-lg text-center mb-6">
            <h1 class="text-2xl font-bold italic tracking-wider text-white-300">COPA CATALANA CADET 2026</h1>
            <p class="text-sm opacity-90">Calendari i Curses Cadet</p>
        </header>

        <div id="lista-carreras" class="px-4 space-y-4">
            <!-- Les curses es generen aquí -->
        </div>
    </div>

    <script>
        // Dades de les curses (Pots afegir-ne més aquí)
        const curses = [
            { 
                data: "28/06/2026", 
                nom: "Trofeu Verbena Sant Joan", 
                lloc: "Montornès del Vallès",
                maps: "https://www.google.com/maps/search/?api=1&query=Carrer+Federico+Garcia+Lorca+Montornès+del+Vallès+Ciclisme",
                web: "https://www.ciclisme.cat/cursa/carretera/trofeo-verbena-san-juan"
            },
            { 
                data: "19/07/2026", 
                nom: "II Trofeu Naut Aran", 
                lloc: "Arties (Naut Aran)",
                maps: "https://www.google.com/maps/search/?api=1&query=Arties+Naut+Aran",
                web: "https://www.ciclisme.cat/cursa/carretera/ii-trofeu-naut-aran"
            },
            { 
                data: "15/08/2026", 
                nom: "GP Festa Major Malgrat", 
                lloc: "Malgrat de Mar",
                maps: "https://www.google.com/maps/search/?api=1&query=Pavelló+Poliesportiu+Malgrat+de+Mar",
                web: "https://www.ciclisme.cat/cursa/carretera/gp-festa-major-malgrat-de-mar"
            },
            { 
                data: "27/09/2026", 
                nom: "GP Ajuntament de Sant Boi", 
                lloc: "Sant Boi de Llobregat",
                maps: "https://www.google.com/maps/search/?api=1&query=Sant+Boi+de+Llobregat+Ciclisme",
                web: "https://www.ciclisme.cat/cursa/carretera/gp-ajuntament-de-sant-boi"
            }
        ];

        const container = document.getElementById('lista-carreras');

        curses.forEach(cursa => {
            const card = document.createElement('div');
            card.className = "card bg-white rounded-xl shadow-md overflow-hidden border-l-8 border-red-600";
            card.innerHTML = `
                <div class="p-4">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-red-600 font-bold text-sm">${cursa.data}</p>
                            <h2 class="text-lg font-bold text-slate-800">${cursa.nom}</h2>
                            <p class="text-slate-500 text-sm flex items-center mt-1">
                                📍 ${cursa.lloc}
                            </p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 mt-4">
                        <a href="${cursa.maps}" target="_blank" class="flex items-center justify-center bg-blue-500 text-white py-2 px-4 rounded-lg text-sm font-bold shadow-sm active:bg-blue-700">
                            🗺️ MAPA (GPS)
                        </a>
                        <a href="${cursa.web}" target="_blank" class="flex items-center justify-center bg-emerald-500 text-white py-2 px-4 rounded-lg text-sm font-bold shadow-sm active:bg-emerald-700">
                            ℹ️ MÉS INFO
                        </a>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>
